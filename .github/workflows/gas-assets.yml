name: Publish GAS assets
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/app-icons/**', 'gas/client/**', 'gas/vite.config.ts', 'scripts/build-gas.mjs', 'package*.json', '.github/workflows/gas-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gas-assets
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:gas && npm run build:gas
      - name: Publish immutable assets, then release pointer
        shell: bash
        run: |
          set -euo pipefail
          cp -R gas/web "$RUNNER_TEMP/gas-web"
          if git ls-remote --exit-code --heads origin gas-runtime >/dev/null; then
            git switch --force-create gas-runtime origin/gas-runtime
          else
            git switch --orphan gas-runtime
            git rm -rf .
          fi
          mkdir -p gas/web
          cp -R "$RUNNER_TEMP/gas-web/." gas/web/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gas/web
          git diff --cached --quiet || git commit -m 'Build GAS frontend assets'
          GAS_ASSET_REVISION="$(git rev-parse HEAD)" node --input-type=module -e "import fs from 'node:fs';const p='gas/web/release.json';const r=JSON.parse(fs.readFileSync(p));r.revision=process.env.GAS_ASSET_REVISION;fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');"
          git add -f gas/web/release.json
          git diff --cached --quiet || git commit -m 'Publish GAS release pointer'
          git push origin HEAD:gas-runtime
